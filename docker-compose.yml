# Arranque con un único comando:  docker compose up --build
# Los valores por defecto son SOLO para desarrollo/demostración. Para uso real, copia
# .env.ejemplo a .env y cambia todos los secretos (el fichero .env no se sube al repositorio).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-presupuesto}
      POSTGRES_USER: ${POSTGRES_USER:-presupuesto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-presupuesto-desarrollo}
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-presupuesto}"]
      interval: 3s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-presupuesto}
      POSTGRES_USER: ${POSTGRES_USER:-presupuesto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-presupuesto-desarrollo}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "8090:8000"

volumes:
  datos_db:
