# Hay DOS presupuestos separados, cada uno con su flujo (decisión 0008): el ordinario (capítulos
# I.1 a I.5 y G.1 a G.6 y G.8) y el electoral, que funciona como un presupuesto extraordinario
# (capítulos con `ambito: ELECTORAL`: I.6, I.7 y G.7).
