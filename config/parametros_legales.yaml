# Parámetros legales (CLAUDE.md §3, regla de oro).
#
# NINGÚN valor está verificado. Este fichero NO afirma que ninguna norma, artículo, límite o
# plazo esté vigente. Para dar un parámetro por válido, el Tesorero (o su asesor) debe rellenar
# TODOS estos campos tras comprobarlo contra el BOE: valor, referencia_normativa,
# fecha_verificacion (AAAA-MM-DD) y verificador. Un parámetro con algún campo vacío se considera
# «pendiente de verificación» y bloquea la regla L-007.
#
# `norma_orientativa` es solo un puntero a las normas citadas en CLAUDE.md §3.1; no es una
# referencia verificada. Los importes se escriben como texto: valor: "1234.56".
