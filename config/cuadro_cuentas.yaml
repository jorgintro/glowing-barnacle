# Cuadro de cuentas y estructura del presupuesto (CLAUDE.md §3.3, §6).
#
# ESTADO: ORIENTATIVO. El mapeo de partidas a cuentas del PGC procede del apartado 3.3 de
# CLAUDE.md y debe ser validado por el Tesorero o su asesor contable antes de usarse en un
# ejercicio real. Mientras `validado_por` esté vacío, la aplicación lo muestra como pendiente.
# Las denominaciones de las cuentas son las del apartado 3.3 de CLAUDE.md, no las oficiales
# del PGC. Las cuentas terminadas en «x» son grupos que el Tesorero debe concretar.
version: 1
validado_por: null
fecha_validacion: null

cuentas:
  - {codigo: "720", denominacion: "Cuotas de afiliados"}
  - {codigo: "72x", denominacion: "Aportaciones y donaciones (según criterio sectorial)"}
  - {codigo: "70x", denominacion: "Ingresos por actividad propia (actos, merchandising)"}
  - {codigo: "74x", denominacion: "Subvenciones y donaciones (según criterio sectorial)"}
  - {codigo: "740", denominacion: "Subvenciones públicas de funcionamiento"}
  - {codigo: "747", denominacion: "Asignaciones a grupos municipales"}
  - {codigo: "75x", denominacion: "Otros ingresos de gestión"}
  - {codigo: "640", denominacion: "Gastos de personal: retribuciones"}
  - {codigo: "642", denominacion: "Gastos de personal: cotización a cargo del partido"}
  - {codigo: "621", denominacion: "Servicios exteriores: alquileres"}
  - {codigo: "622", denominacion: "Servicios exteriores: reparaciones y mantenimiento"}
  - {codigo: "623", denominacion: "Servicios exteriores: asesoría y servicios profesionales"}
  - {codigo: "628", denominacion: "Servicios exteriores: suministros"}
  - {codigo: "627", denominacion: "Publicidad y propaganda"}
  - {codigo: "62x", denominacion: "Otros servicios exteriores"}
  - {codigo: "65x", denominacion: "Otros gastos de gestión"}
  - {codigo: "66x", denominacion: "Gastos financieros"}
  - {codigo: "68x", denominacion: "Amortizaciones"}
  # Cuentas de la actividad electoral: modelo aportado por el Tesorero el 30/10/2026
  # (docs/fuentes_normativas/LOREG_gastos_electorales_aportado_por_el_tesorero.md). Pendiente de validar.
  - {codigo: "721", denominacion: "Subvenciones públicas por resultados electorales"}
  - {codigo: "722", denominacion: "Subvenciones públicas por envíos electorales"}
  - {codigo: "731", denominacion: "Ingresos electorales de origen privado"}
  - {codigo: "650", denominacion: "Personal no permanente: sueldos, salarios y asimilados"}
  - {codigo: "651", denominacion: "Personal no permanente: cargas sociales"}
  - {codigo: "6521", denominacion: "Gastos electorales: arrendamientos"}
  - {codigo: "6523", denominacion: "Gastos electorales: servicios de profesionales independientes"}
  - {codigo: "6524", denominacion: "Gastos electorales: transportes"}
  - {codigo: "6525", denominacion: "Gastos electorales: primas de seguros"}
  - {codigo: "6526", denominacion: "Gastos electorales: servicios bancarios y similares"}
  - {codigo: "65270", denominacion: "Gastos electorales: publicidad en prensa y radio"}
  - {codigo: "65271", denominacion: "Gastos electorales: publicidad exterior"}
  - {codigo: "65272", denominacion: "Gastos electorales: otra propaganda y publicidad dirigida a promover el voto"}
  - {codigo: "6529", denominacion: "Gastos electorales: otros servicios"}
  - {codigo: "6530", denominacion: "Envíos electorales: confección de sobres y papeletas"}
  - {codigo: "6531", denominacion: "Envíos electorales: confección de propaganda para su envío"}
  - {codigo: "6532", denominacion: "Envíos electorales: correspondencia y franqueo"}
  - {codigo: "6539", denominacion: "Otros gastos por envíos electorales"}
  - {codigo: "6630", denominacion: "Gastos financieros electorales liquidados"}
  - {codigo: "6631", denominacion: "Gastos financieros electorales estimados"}
  - {codigo: "6632", denominacion: "Gastos financieros electorales liquidados (otros)"}

capitulos:
  # ------------------------------------------------------------------ INGRESOS
  - codigo: "I.1"
    tipo: INGRESO
    denominacion: "Cuotas de afiliados"
    partidas:
      - {codigo: "I.1.1", denominacion: "Cuotas ordinarias de afiliados", cuentas: ["720"]}
  - codigo: "I.2"
    tipo: INGRESO
    denominacion: "Aportaciones de cargos públicos"
    partidas:
      - {codigo: "I.2.1", denominacion: "Aportaciones de cargos públicos", cuentas: ["72x", "74x"]}
  - codigo: "I.3"
    tipo: INGRESO
    denominacion: "Subvenciones públicas"
    partidas:
      - {codigo: "I.3.1", denominacion: "Subvención por representación municipal (partido)", cuentas: ["740"]}
      - {codigo: "I.3.2", denominacion: "Asignaciones a grupos municipales", cuentas: ["747"], dimension: GRUPO_MUNICIPAL}
      - {codigo: "I.3.3", denominacion: "Otras subvenciones", cuentas: ["740"]}
      - {codigo: "I.3.4", denominacion: "Subvención electoral por resultados", cuentas: ["721"], dimension: CAMPANA}
      - {codigo: "I.3.5", denominacion: "Subvención electoral por envíos directos", cuentas: ["722"], dimension: CAMPANA}
  - codigo: "I.4"
    tipo: INGRESO
    denominacion: "Donaciones"
    partidas:
      - {codigo: "I.4.1", denominacion: "Donaciones dinerarias", cuentas: ["74x", "72x"]}
      - {codigo: "I.4.2", denominacion: "Donaciones en especie", cuentas: ["74x", "72x"]}
      - {codigo: "I.4.3", denominacion: "Donaciones y aportaciones para la campaña electoral", cuentas: ["731"], dimension: CAMPANA}
  - codigo: "I.5"
    tipo: INGRESO
    denominacion: "Otros ingresos"
    partidas:
      - {codigo: "I.5.1", denominacion: "Actos y merchandising", cuentas: ["70x", "75x"]}
      - {codigo: "I.5.2", denominacion: "Rendimientos financieros", cuentas: ["75x"]}
      - {codigo: "I.5.3", denominacion: "Otros ingresos de actividad propia", cuentas: ["70x", "75x"]}
  # ------------------------------------------------------------------- GASTOS
  - codigo: "G.1"
    tipo: GASTO
    denominacion: "Gastos de personal"
    partidas:
      - {codigo: "G.1.1", denominacion: "Retribuciones del personal", cuentas: ["640"]}
      - {codigo: "G.1.2", denominacion: "Cotización a cargo del partido", cuentas: ["642"]}
  - codigo: "G.2"
    tipo: GASTO
    denominacion: "Servicios exteriores y funcionamiento"
    partidas:
      - {codigo: "G.2.1", denominacion: "Sede y alquileres", cuentas: ["621"]}
      - {codigo: "G.2.2", denominacion: "Suministros", cuentas: ["628"]}
      - {codigo: "G.2.3", denominacion: "Asesoría y gestoría", cuentas: ["623"]}
      - {codigo: "G.2.4", denominacion: "Seguros", cuentas: ["62x"]}
      - {codigo: "G.2.5", denominacion: "Material y mantenimiento", cuentas: ["622", "62x"]}
      - {codigo: "G.2.6", denominacion: "Tecnologías de la información", cuentas: ["62x"]}
  - codigo: "G.3"
    tipo: GASTO
    denominacion: "Actividades y órganos del partido"
    partidas:
      - {codigo: "G.3.1", denominacion: "Juntas y asambleas", cuentas: ["62x", "65x"]}
      - {codigo: "G.3.2", denominacion: "Comisión Permanente", cuentas: ["62x", "65x"]}
      - {codigo: "G.3.3", denominacion: "Formación", cuentas: ["62x", "65x"]}
      - {codigo: "G.3.4", denominacion: "Actos y jornadas", cuentas: ["62x", "65x"]}
      - {codigo: "G.3.5", denominacion: "Desplazamientos", cuentas: ["62x", "65x"]}
  - codigo: "G.4"
    tipo: GASTO
    denominacion: "Comunicación, publicidad y propaganda"
    partidas:
      - {codigo: "G.4.1", denominacion: "Web y redes sociales", cuentas: ["627"]}
      - {codigo: "G.4.2", denominacion: "Imprenta y cartelería", cuentas: ["627"]}
      - {codigo: "G.4.3", denominacion: "Publicidad", cuentas: ["627"]}
      - {codigo: "G.4.4", denominacion: "Material divulgativo", cuentas: ["627"]}
  - codigo: "G.5"
    tipo: GASTO
    denominacion: "Gastos financieros"
    partidas:
      - {codigo: "G.5.1", denominacion: "Comisiones bancarias", cuentas: ["66x"]}
      - {codigo: "G.5.2", denominacion: "Intereses de préstamos", cuentas: ["66x"]}
  - codigo: "G.6"
    tipo: GASTO
    denominacion: "Amortizaciones"
    partidas:
      - {codigo: "G.6.1", denominacion: "Amortización del inmovilizado", cuentas: ["68x"]}
  - codigo: "G.7"
    tipo: GASTO
    denominacion: "Gastos electorales"
    solo_con_proceso_electoral: true
    partidas:
      - {codigo: "G.7.1", denominacion: "Personal no permanente", cuentas: ["650", "651"], dimension: CAMPANA}
      - {codigo: "G.7.2", denominacion: "Alquiler de locales para actos de campaña", cuentas: ["6521"], dimension: CAMPANA}
      - {codigo: "G.7.3", denominacion: "Servicios de profesionales independientes", cuentas: ["6523"], dimension: CAMPANA}
      - {codigo: "G.7.4", denominacion: "Transportes y desplazamientos", cuentas: ["6524"], dimension: CAMPANA}
      - {codigo: "G.7.5", denominacion: "Primas de seguros", cuentas: ["6525"], dimension: CAMPANA}
      - {codigo: "G.7.6", denominacion: "Servicios bancarios y similares", cuentas: ["6526"], dimension: CAMPANA}
      - {codigo: "G.7.7", denominacion: "Publicidad en prensa y radio", cuentas: ["65270"], dimension: CAMPANA}
      - {codigo: "G.7.8", denominacion: "Publicidad exterior", cuentas: ["65271"], dimension: CAMPANA}
      - {codigo: "G.7.9", denominacion: "Otra propaganda y publicidad dirigida a promover el voto", cuentas: ["65272"], dimension: CAMPANA}
      - {codigo: "G.7.10", denominacion: "Otros servicios de la campaña", cuentas: ["6529"], dimension: CAMPANA}
      - {codigo: "G.7.11", denominacion: "Envíos electorales: confección de sobres y papeletas", cuentas: ["6530"], dimension: CAMPANA, envio_electoral: true}
      - {codigo: "G.7.12", denominacion: "Envíos electorales: confección de propaganda para su envío", cuentas: ["6531"], dimension: CAMPANA, envio_electoral: true}
      - {codigo: "G.7.13", denominacion: "Envíos electorales: correspondencia y franqueo", cuentas: ["6532"], dimension: CAMPANA, envio_electoral: true}
      - {codigo: "G.7.14", denominacion: "Otros gastos por envíos electorales", cuentas: ["6539"], dimension: CAMPANA, envio_electoral: true}
      - {codigo: "G.7.15", denominacion: "Gastos financieros de la campaña (intereses de créditos)", cuentas: ["6630", "6631", "6632"], dimension: CAMPANA}
  - codigo: "G.8"
    tipo: GASTO
    denominacion: "Imprevistos y contingencias"
    partidas:
      # CLAUDE.md §3.3 no asigna cuenta a los imprevistos: el Tesorero debe fijarla.
      - {codigo: "G.8.1", denominacion: "Reserva de contingencia", cuentas: ["65x"]}
