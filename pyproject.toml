[project]
name = "iniciativa-presupuesto"
version = "0.1.0"
description = "Elaboración y aprobación del presupuesto anual de Iniciativa Complutense"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "proyecto.settings_pruebas"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "proyecto.settings_pruebas"
python_files = ["test_*.py"]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["reportlab", "reportlab.*"]
ignore_missing_imports = true
